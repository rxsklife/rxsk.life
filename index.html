<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>@rxsklife | security researcher</title>

	<link rel="icon" href="favicon.ico" type="image/png" />

	<link href="https://fonts.googleapis.com/css?family=JetBrains+Mono:400,700&display=swap" rel="stylesheet">
	<style>
		/* Critical inline styles — ensures layout works even if external CSS fails to load
		   (e.g. Instagram in-app browser) */
		html { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
		body {
			background: #0d1117; color: #c9d1d9; margin: 0;
			min-height: 100vh; display: flex; align-items: center; justify-content: center;
		}
		*, *:before, *:after { box-sizing: border-box; }
	</style>
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<main>
		<div class="terminal-card">
			<div class="terminal-header">
				<div class="terminal-dots">
					<span class="dot red"></span>
					<span class="dot yellow"></span>
					<span class="dot green"></span>
				</div>
				<div class="terminal-title">guest@rxsk.life:~$</div>
			</div>
			<div class="terminal-body">
				<div class="profile-section">
					<div class="profile-pic">
						<img src="https://i.imgur.com/ms6pCtK.png" alt="Profile Picture">
					</div>
					<div class="intro">@rxsklife</div>
					<div class="tagline">OSINT • Threat Intelligence • AI Development</div>
				</div>

				<div class="typing-line">
					<span class="prompt">guest@rxsk.life:~$</span>
					<span class="command">tree links/</span>
				</div>

				<div class="tree-section">
					<div class="tree-header">
						<span class="tree-dir">links/</span>
					</div>
					<a target="_blank" href="https://t.me/rxsklife" class="tree-entry">
						<span class="tree-branch">├──</span>
						<span class="link-icon"><i class="fab fa-telegram"></i></span>
						<span class="link-name">telegram</span>
						<span class="link-url">t.me/rxsklife</span>
					</a>
					<a target="_blank" href="https://github.com/rxsklife" class="tree-entry">
						<span class="tree-branch">├──</span>
						<span class="link-icon"><i class="fab fa-github"></i></span>
						<span class="link-name">github</span>
						<span class="link-url">github.com/rxsklife</span>
					</a>
					<a target="_blank" href="https://twitter.com/rxsklife" class="tree-entry">
						<span class="tree-branch">├──</span>
						<span class="link-icon"><i class="fab fa-twitter"></i></span>
						<span class="link-name">twitter</span>
						<span class="link-url">twitter.com/rxsklife</span>
					</a>
					<a target="_blank" href="https://medium.com/@rxsklife" class="tree-entry">
						<span class="tree-branch">└──</span>
						<span class="link-icon"><i class="fab fa-medium"></i></span>
						<span class="link-name">medium</span>
						<span class="link-url">medium.com/@rxsklife</span>
					</a>
				</div>

				<div class="typing-line">
					<span class="prompt">guest@rxsk.life:~$</span>
					<span class="command">play promise.mp3</span>
					<button class="music-btn" id="musicPlayBtn" aria-label="Play"><i class="fas fa-play"></i></button>
					<button class="music-btn" id="musicPauseBtn" aria-label="Pause"><i class="fas fa-pause"></i></button>
					<span class="music-status" id="musicStatus"><i class="fas fa-play"></i> Playing</span>
					<audio id="musicPlayer" autoplay loop>
						<source src="Promise.mp3" type="audio/mpeg">
					</audio>
				</div>

				<div class="thm-wrapper">
					<iframe class="tryhackme-badge" src="https://tryhackme.com/api/v2/badges/public-profile?userPublicId=1454241" style="border:none;" scrolling="no"></iframe>
				</div>

				<a target="_blank" href="https://buymeacoffee.com/rxsklife" class="bmc-button">
					<img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me a Coffee" class="bmc-img">
				</a>
			</div>
		</div>
	</main>

	<script>
		const player = document.getElementById('musicPlayer');
		const playBtn = document.getElementById('musicPlayBtn');
		const pauseBtn = document.getElementById('musicPauseBtn');
		const status = document.getElementById('musicStatus');

		playBtn.addEventListener('click', () => {
			player.play();
			status.innerHTML = '<i class="fas fa-play"></i> Playing';
		});

		pauseBtn.addEventListener('click', () => {
			player.pause();
			status.innerHTML = '<i class="fas fa-pause"></i> Paused';
		});

		// Scale THM badge to fit its container on small screens
		const thmWrapper = document.querySelector('.thm-wrapper');
		const thmBadge = document.querySelector('.tryhackme-badge');
		function scaleThmBadge() {
			const wrapperWidth = thmWrapper.clientWidth;
			if (wrapperWidth < 329) {
				const scale = wrapperWidth / 329;
				thmWrapper.style.height = (88 * scale) + 'px';
				thmBadge.style.cssText = 'border:none;width:329px;height:88px;transform-origin:top left;transform:scale(' + scale + ');';
			} else {
				thmWrapper.style.height = '';
				thmBadge.style.cssText = 'border:none;';
			}
		}
		if (thmWrapper && thmBadge) {
			scaleThmBadge();
			window.addEventListener('resize', scaleThmBadge);
		
			// Cache-bust the TryHackMe badge once on page load to refresh avatar (and every 5 minutes)
			// This forces the iframe to be fetched fresh, which can fix stale or cached avatar images.
			(function refreshThmBadge() {
				try {
					const baseSrc = thmBadge.src.split('?')[0];
					// load fresh on first render
					thmBadge.src = baseSrc + '?userPublicId=1454241&t=' + Date.now();
					// auto-refresh every 5 minutes
					setInterval(() => { thmBadge.src = baseSrc + '?userPublicId=1454241&t=' + Date.now(); }, 5 * 60 * 1000);
				} catch (e) {
					// ignore if something goes wrong — nothing critical
				}
			})();
		}
	</script>
</body>
</html>
